services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: admin_veille_igts
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      # Imported only the first time (when the volume is empty)
      - ./veille_db.sql:/docker-entrypoint-initdb.d/init.sql
      # Named volume: data (test accounts, evaluations…) survives restarts
      # and `docker compose down`. Reset with `docker compose down -v`.
      - db_data:/var/lib/mysql

volumes:
  db_data:
